<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>부동산 추천 에이전트</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7; --panel: #ffffff; --text: #1c1f24; --muted: #6b7280; --line: #e3e6ea;
    --accent: #2f6f5e; --accent-soft: #e6f1ed; --user: #2f6f5e; --user-text: #ffffff; --code: #f3f4f6;
    --scroll: #c9ced4; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171a; --panel: #1e2125; --text: #e7e9ec; --muted: #9aa1ab; --line: #2e3238;
      --accent: #6cc3a6; --accent-soft: #1f3530; --user: #2f6f5e; --user-text: #ffffff; --code: #262a2f;
      --scroll: #3a3f46; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  .app { max-width: 860px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  header .uid { font-size: 12px; color: var(--muted); background: var(--accent-soft); padding: 3px 10px; border-radius: 12px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 18px 6px 18px 0; display: flex; flex-direction: column; gap: 14px; }
  #log, textarea, .step pre { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); color: var(--user-text); border-bottom-right-radius: 4px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.bot h1, .msg.bot h2, .msg.bot h3 { font-size: 15px; margin: 12px 0 4px; }
  .msg.bot p { margin: 6px 0; }
  .msg.bot ul, .msg.bot ol { margin: 4px 0; padding-left: 22px; }
  .msg.bot table { border-collapse: collapse; font-size: 13px; margin: 6px 0; }
  .msg.bot td, .msg.bot th { border: 1px solid var(--line); padding: 3px 8px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  details { margin-top: 8px; font-size: 13px; }
  summary { cursor: pointer; color: var(--accent); }
  .step { background: var(--code); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .step b { color: var(--accent); }
  .step pre { margin: 4px 0 0; white-space: pre-wrap; font-size: 12px; max-height: 160px; overflow: auto; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .chips button { font-size: 13px; padding: 4px 10px; border-radius: 14px; }
  .empty { color: var(--muted); text-align: center; margin: auto 0; }
  .empty h2 { color: var(--text); font-size: 18px; }
  form { display: flex; gap: 8px; padding: 12px 0 16px; border-top: 1px solid var(--line); }
  textarea { flex: 1; resize: none; height: 46px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
             background: var(--panel); color: var(--text); font: inherit; }
  .typing { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>🏠 부동산 추천 에이전트<small>실거래가 · 대출 한도 기반 단지 추천</small></h1>
    <span class="uid" id="uidLabel" title="이 브라우저에 자동으로 만든 익명 ID예요. 저장한 조건은 이 ID로만 불러올 수 있어요."></span>
    <button id="newChat" type="button">새 대화</button>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      <h2>연소득·보유 현금·직장 위치·희망 평형을 알려주세요</h2>
      <div>지원 직장 거점: 잠실 · 판교 · 분당</div>
      <div class="chips" style="justify-content:center">
        <button type="button">연봉 7천에 현금 2억이고 판교로 출근해요. 25평 아파트 추천해줘</button>
        <button type="button">현금 5천 더 있으면요?</button>
        <button type="button">이 조건 저장해줘</button>
        <button type="button">저번 조건으로 다시 추천해줘</button>
        <button type="button">생애최초로 수도권 아파트를 사면 LTV 몇 퍼센트까지 돼요?</button>
        <button type="button">용인 수지구 25평 아파트 최근 3개월 시세 알려줘</button>
      </div>
    </div>
  </div>

  <form id="form">
    <textarea id="q" placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
    <button class="primary" id="send">전송</button>
  </form>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log"), q = $("q"), send = $("send");
  let sessionId = null;

  // 익명 사용자 ID: 처음 접속할 때 무작위로 만들어 이 브라우저에 기억한다 (이름·이메일 등은 쓰지 않음)
  function anonId() {
    const make = () => "anon-" + (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
    try {
      let id = localStorage.getItem("home-agent-uid");
      if (!id || !id.startsWith("anon-")) { id = make(); localStorage.setItem("home-agent-uid", id); }
      return id;
    } catch (e) { return make(); }   // 저장소를 못 쓰면 이 창에서만 유지
  }
  const userId = anonId();
  $("uidLabel").textContent = "🔑 익명 ID " + userId.slice(5, 13);

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const md = (s) => window.marked ? marked.parse(esc(s), { breaks: true }) : esc(s).replace(/\n/g, "<br>");
  const pretty = (s) => { try { return JSON.stringify(JSON.parse(s), null, 1); } catch (e) { return s; } };

  function add(role, html) {
    $("empty")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + role;
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function botMessage(data, seconds, firstToken) {
    let html = md(data.answer);
    const first = firstToken != null ? ` (첫 글자 ${firstToken.toFixed(1)}초)` : "";
    html += `<div class="meta">⏱ ${seconds.toFixed(1)}초${first} · 도구 ${data.trace.length}개 · 근거 ${data.contexts.length}개</div>`;
    if (data.trace.length || data.contexts.length) {
      html += "<details><summary>근거 보기 (trace · contexts)</summary>";
      html += data.trace.map((t, i) => `<div class="step"><b>${i + 1}. ${esc(t.step)}</b> 입력: ${esc(t.input)}<pre>${esc(pretty(t.output))}</pre></div>`).join("");
      html += data.contexts.filter(c => c.doc_id.includes("#"))
        .map(c => `<div class="step"><b>📄 ${esc(c.doc_id)}</b><pre>${esc(c.text)}</pre></div>`).join("");
      html += "</details>";
    }
    const div = add("bot", html);
    if (data.answer.includes("취소하려면 '아니요'")) {
      const chips = document.createElement("div");
      chips.className = "chips";
      chips.innerHTML = '<button type="button" class="primary">네</button><button type="button">아니요</button>';
      div.appendChild(chips);
    }
  }

  const TOOL_LABELS = {
    region_code_lookup: "지역 코드 확인", get_candidate_regions: "통근 후보 지역 조회",
    apt_trades: "실거래 조회", summarize_trades: "실거래 3개월 요약",
    calc_loan_budget: "대출 한도 계산", search_policy: "정책 문서 검색",
    save_conditions: "조건 저장 준비", load_conditions: "저장된 조건 불러오기", delete_conditions: "조건 삭제 준비",
  };

  async function ask(text) {
    text = text.trim();
    if (!text || send.disabled) return;
    const userBubble = add("user", esc(text));
    q.value = "";
    send.disabled = true;
    const live = add("bot", '<div class="typing" id="status">질문을 이해하는 중… <span id="sec">0</span>초</div><div id="stream"></div>');
    const status = live.querySelector("#status"), streamDiv = live.querySelector("#stream");
    const start = performance.now();
    const timer = setInterval(() => { const s = live.querySelector("#sec"); if (s) s.textContent = Math.floor((performance.now() - start) / 1000); }, 500);
    let buffer = "", streamed = "", firstToken = null, done = false;
    const setStatus = (label) => { status.innerHTML = `${label}… <span id="sec">${Math.floor((performance.now() - start) / 1000)}</span>초`; };

    function handle(ev) {
      if (ev.type === "token") {
        if (firstToken === null) firstToken = (performance.now() - start) / 1000;
        streamed += ev.text;
        streamDiv.innerHTML = md(streamed);
        log.scrollTop = log.scrollHeight;
      } else if (ev.type === "masked_question") {
        userBubble.innerHTML = esc(ev.text);   // 개인정보는 가린 문장으로 바꿔 보여준다
      } else if (ev.type === "tool") {
        if (streamed && !streamed.endsWith("\n\n")) streamed += "\n\n";   // 도구 호출 전 안내 문장은 남기고 다음 글과 띄운다
        setStatus("🔧 " + (TOOL_LABELS[ev.name] || ev.name) + " 중");
      } else if (ev.type === "reset") {
        streamed = ""; streamDiv.innerHTML = "";
      } else if (ev.type === "done") {
        done = true;
        sessionId = ev.session_id;
        live.remove();
        botMessage(ev, (performance.now() - start) / 1000, firstToken);
      } else if (ev.type === "error") {
        throw new Error(ev.message);
      }
    }

    try {
      const body = { question: text };
      if (sessionId) body.session_id = sessionId;
      body.user_id = userId;
      const res = await fetch("/query/stream", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!res.ok) throw new Error(`서버 오류 ${res.status}`);
      const reader = res.body.getReader(), decoder = new TextDecoder();
      while (true) {
        const { value, done: end } = await reader.read();
        if (end) break;
        buffer += decoder.decode(value, { stream: true });
        let idx;
        while ((idx = buffer.indexOf("\n\n")) >= 0) {
          const line = buffer.slice(0, idx).trim();
          buffer = buffer.slice(idx + 2);
          if (line.startsWith("data:")) handle(JSON.parse(line.slice(5)));
        }
      }
      if (!done) throw new Error("응답이 중간에 끊겼어요");
    } catch (err) {
      status.innerHTML = `⚠️ ${esc(err.message)}`;
    } finally {
      clearInterval(timer);
      send.disabled = false;
      q.focus();
    }
  }

  $("form").addEventListener("submit", (e) => { e.preventDefault(); ask(q.value); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(q.value); } });
  log.addEventListener("click", (e) => { if (e.target.closest(".chips button")) ask(e.target.textContent); });
  $("newChat").addEventListener("click", () => { location.reload(); });
</script>
</body>
</html>
